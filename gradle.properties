# Gradle daemon JVM args — Gradle 8.7 requires JDK 17+
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX (mandatory in AGP 8+; legacy support libs are EOL since 2018)
android.useAndroidX=true

# Reduce memory + speed up incremental builds
android.nonTransitiveRClass=true
