name: Release

# BEE-66: publish :AndroidBeepingCore to Maven Central via the Sonatype Central
# Portal. Triggered by pushing a `v*.*.*` tag. The workflow runs only after CI
# (build + tests + lint) has succeeded on the tagged commit.
#
# This workflow is currently INERT until:
#   1. The `io.beeping` namespace is verified on Central Portal (DNS TXT on
#      beeping.io with the verification token).
#   2. The 5 secrets below are configured in the repo settings.
#
# Once those are in place, pushing `v0.0.0` triggers the first real release.
# Until then, manual `workflow_dispatch` runs will fail at the
# `publishAndReleaseToMavenCentral` step with "no credentials" or "namespace
# not verified" — both expected.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Skip the actual publish to Central (only run the local build + sign)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: 📦 Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🧰 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔑 Validate secrets
        # Fail-fast if any required secret is missing — better than a silent
        # half-publish that uploads unsigned artifacts. SIGNING_KEY_ID is
        # documented as required for keys with signing subkeys; our master
        # key signs directly so we treat it as optional.
        env:
          MCU: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MCP: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SK: ${{ secrets.SIGNING_KEY }}
          SKP: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for var in MCU MCP SK SKP; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required secret: $var"
              echo "See docs/maven-central-publishing.md for the onboarding flow."
              exit 1
            fi
          done
          echo "✅ All required secrets are present"

      - name: 🔧 publishToMavenLocal (dry-run + verify artifacts)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Note: SIGNING_KEY_ID intentionally NOT mapped. Our master key has the
          # [SC] (sign + certify) flag and no separate signing subkey, so the
          # in-memory signing plugin should default to the master. Passing the
          # 8-char keyId made BouncyCastle look for a subkey with that ID and
          # silently fall through to "no configured signatory".
        run: |
          ./gradlew :AndroidBeepingCore:publishToMavenLocal --no-configuration-cache
          echo "── Local artifacts ──"
          find ~/.m2/repository/io/beeping/beeping-android -type f | sort

      - name: 🚀 Publish to Maven Central (Sonatype Portal)
        if: ${{ github.event_name == 'push' || github.event.inputs.dryRun == 'false' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Note: SIGNING_KEY_ID intentionally NOT mapped. Our master key has the
          # [SC] (sign + certify) flag and no separate signing subkey, so the
          # in-memory signing plugin should default to the master. Passing the
          # 8-char keyId made BouncyCastle look for a subkey with that ID and
          # silently fall through to "no configured signatory".
        run: |
          ./gradlew :AndroidBeepingCore:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: 📝 Summary
        if: always()
        run: |
          echo "### Release summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: \`${{ github.event.inputs.dryRun || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "After the workflow finishes, the artifact stages on" >> $GITHUB_STEP_SUMMARY
          echo "https://central.sonatype.com/publishing and requires a manual" >> $GITHUB_STEP_SUMMARY
          echo "**Publish** click (automaticRelease=false in build.gradle.kts)." >> $GITHUB_STEP_SUMMARY
