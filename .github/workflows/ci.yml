name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'milestone/**'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Cancel duplicate runs on the same ref (faster CI on rapid pushes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🤖 Build & Test (legacy stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🧼 Lint & static analysis (ktlint + detekt + Android Lint)
        run: ./gradlew --no-daemon :AndroidBeepingCore:ktlintCheck :AndroidBeepingCore:detekt :AndroidBeepingCore:lint

      - name: 🧪 Run unit tests (`:AndroidBeepingCore:test`)
        run: ./gradlew --no-daemon :AndroidBeepingCore:test

      - name: 📊 Coverage report + threshold gate (Kover ≥ 70%)
        run: ./gradlew --no-daemon :AndroidBeepingCore:koverXmlReport :AndroidBeepingCore:koverHtmlReport :AndroidBeepingCore:koverVerify

      - name: 🏗️ Assemble debug APK (`:app:assembleDebug`)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: 📤 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: AndroidBeepingCore/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: |
            AndroidBeepingCore/build/reports/kover/html/
            AndroidBeepingCore/build/reports/kover/report.xml
          if-no-files-found: ignore
          retention-days: 7

  commitlint:
    name: 📝 Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install deps
        run: npm ci

      - name: 📝 Lint commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          echo "Linting commits from $BASE to $HEAD"
          npx commitlint --from "$BASE" --to "$HEAD" --verbose
