name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'milestone/**'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Cancel duplicate runs on the same ref (faster CI on rapid pushes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🤖 Build & Test (legacy stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🧼 Lint & static analysis (ktlint + detekt + Android Lint)
        run: ./gradlew --no-daemon :AndroidBeepingCore:ktlintCheck :AndroidBeepingCore:detekt :AndroidBeepingCore:lint

      - name: 🧪 Run unit tests (`:AndroidBeepingCore:test`)
        run: ./gradlew --no-daemon :AndroidBeepingCore:test

      - name: 📊 Coverage report + threshold gate (Kover ≥ 70%)
        run: ./gradlew --no-daemon :AndroidBeepingCore:koverXmlReport :AndroidBeepingCore:koverHtmlReport :AndroidBeepingCore:koverVerify

      - name: 🏗️ Assemble debug APK (`:app:assembleDebug`)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: 📤 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: AndroidBeepingCore/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: |
            AndroidBeepingCore/build/reports/kover/html/
            AndroidBeepingCore/build/reports/kover/report.xml
          if-no-files-found: ignore
          retention-days: 7

  maven-publish-smoke:
    name: 📦 Maven publish smoke (publishToMavenLocal + POM validation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # BEE-66: catches POM regressions, missing artifacts, broken Dokka, etc.
    # No signing — credentials only land in the release workflow.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 📤 publishToMavenLocal
        run: ./gradlew --no-daemon :AndroidBeepingCore:publishToMavenLocal

      - name: ✅ Verify artifacts + POM mandatory fields
        run: |
          # Version-agnostic: pick whatever directory publishToMavenLocal created.
          # Keeps the smoke job decoupled from the version bumped in build.gradle.kts.
          BASE=~/.m2/repository/io/beeping/beeping-android
          DIR=$(find "$BASE" -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -z "$DIR" ]; then
            echo "❌ No version directory found under $BASE — did publishToMavenLocal run?"
            exit 1
          fi
          VERSION=$(basename "$DIR")
          echo "── Artifacts produced (v$VERSION) ──"
          ls -la "$DIR"

          for f in beeping-android-${VERSION}.aar beeping-android-${VERSION}-sources.jar beeping-android-${VERSION}-javadoc.jar beeping-android-${VERSION}.pom beeping-android-${VERSION}.module; do
            if [ ! -f "$DIR/$f" ]; then
              echo "❌ Missing artifact: $f"
              exit 1
            fi
            echo "✅ $f ($(stat -c%s "$DIR/$f" 2>/dev/null || stat -f%z "$DIR/$f") bytes)"
          done

          echo "── POM mandatory fields (Sonatype Central Portal) ──"
          POM="$DIR/beeping-android-${VERSION}.pom"
          for tag in "<name>" "<description>" "<url>" "<licenses>" "<developers>" "<scm>"; do
            if ! grep -q "$tag" "$POM"; then
              echo "❌ POM missing required tag: $tag"
              exit 1
            fi
            echo "✅ $tag"
          done

      - name: 📤 Upload published artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/io/beeping/beeping-android/
          if-no-files-found: error
          retention-days: 7

  commitlint:
    name: 📝 Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install deps
        run: npm ci

      - name: 📝 Lint commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          echo "Linting commits from $BASE to $HEAD"
          npx commitlint --from "$BASE" --to "$HEAD" --verbose
