# Version catalog — single source of truth for plugins, libs, and bundles.
# https://docs.gradle.org/current/userguide/platforms.html

[versions]
# Android Gradle Plugin + NDK
agp = "8.7.3"
ndk = "27.0.12077973"

# Android SDK levels (Android 7.0+ → Android 15)
compileSdk = "35"
targetSdk = "35"
minSdk = "24"

# Java toolchain — Gradle 8.7 requires JDK 17+
javaTarget = "17"

# Kotlin — applied to the Android modules in BEE-53 (Java→Kotlin migration)
kotlin = "2.0.21"
kotlinBom = "2.0.21"

# Kotlin coroutines (replaces legacy Timer/TimerTask polling loops)
coroutines = "1.9.0"

# Ktor — HTTP client for CloudEncoder (BEE-57)
ktor = "3.0.3"

# Kotlinx Serialization — JSON for Ktor request/response (BEE-57)
kotlinxSerializationJson = "1.7.3"

# OpenAPI Generator — generates the Ktor client from beepbox's openapi.yaml (BEE-59)
openApiGenerator = "7.10.0"

# AndroidX libraries (replaces deprecated com.android.support)
androidxAppcompat = "1.7.0"
androidxCore = "1.13.1"

# Logging — Timber JSON sink + trace-ID (BEE-60)
timber = "5.0.1"

# Test libraries
junit = "4.13.2"
turbine = "1.1.0"
mockk = "1.13.13"

[libraries]
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlinBom" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[bundles]
androidx-base = ["androidx-appcompat", "androidx-core"]
ktor-client = ["ktor-client-core", "ktor-client-android", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json", "kotlinx-serialization-json"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openApiGenerator" }
